aid: abmrespiratorycare
name: ABM Respiratory Care
description: 'ABM Respiratory Care (ABMRC, LLC — operating with Advanced Biomechanics Private Limited
  in Bangalore, India and Advanced Bio Machines PTE LTD in Singapore, with US headquarters in Eagan,
  Minnesota) is a privately held respiratory medical device manufacturer founded by CTO Vinay Joshi and
  led by CEO Greg Miller. It designs, manufactures and sells airway clearance and lung ventilation
  hardware under the BiWaze brand — BiWaze Clear (oscillation and lung expansion therapy) and BiWaze
  Cough (mechanical insufflation-exsufflation) — in both hospital and home-care configurations, sold
  through direct sales, demo requests and reimbursement channels rather than self-service signup. ABM
  Respiratory Care is a physical device company: it publishes no developer portal, no public API, no SDK
  and no machine-readable specification, and its entire public web surface is a WordPress marketing site
  at abmrc.com plus a separate WordPress electronic instructions-for-use portal at eifu.abmrc.com.'
